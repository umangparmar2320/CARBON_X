<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CarbonX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages/auth.css">
</head>

<body>
    <div class="auth-page">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fas fa-leaf"></i> CarbonX
                </a>
                <h2>Welcome Back</h2>
                <p>Enter your credentials to access your account</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" value="demo" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" placeholder="••••••••" value="password123" required>
                        <button type="button" class="password-toggle" id="toggle-pw">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="divider">OR</div>

            <p class="text-center text-muted" style="font-size: 0.9rem;">
                Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Create
                    one free</a>
            </p>
        </div>
    </div>

    <script src="js/core/auth.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/services/notifications.js"></script>
    <script src="js/core/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await Auth.login(
                document.getElementById('username').value,
                document.getElementById('password').value
            );
            if (res.success) {
                window.location.href = 'dashboard.html';
            } else {
                alert(res.message);
            }
        });
        document.getElementById('toggle-pw').addEventListener('click', (e) => {
            e.preventDefault();
            const pw = document.getElementById('password');
            const icon = document.querySelector('#toggle-pw i');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pw.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });
    </script>
</body>

</html>
